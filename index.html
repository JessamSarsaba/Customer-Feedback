/* Layout: fixed navy-on-mist sidebar + records workspace; one primary action (Add customer), everything else quiet. */
:root{
  --bg:#eef3f8; --surface:#ffffff; --surface-2:#f4f8fb; --line:#dbe5ee; --line-strong:#c4d3e0;
  --ink:#0f2233; --muted:#5d7185; --brand:#0b3c61; --brand-ink:#ffffff; --brand-text:#0b3c61;
  --nav-active:#dce9f4; --ring:#2a7fc1;
  --danger:#c4161c; --danger-text:#a8121a; --danger-bg:#fdeeee; --danger-line:#f4c9c9;
  --ok-text:#17693f; --ok-bg:#e1f3e8; --warn-text:#8a5a00; --warn-bg:#fdf1d6;
  --avatar-bg:#d6eee3; --avatar-ink:#1b6a4f; --scrim:rgba(9,24,38,.55); --shadow:0 12px 40px rgba(9,24,38,.22);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1620; --surface:#12212d; --surface-2:#182a39; --line:#24384a; --line-strong:#34506a;
    --ink:#e7eff6; --muted:#8fa5b8; --brand:#2f7fc0; --brand-ink:#ffffff; --brand-text:#8cc4f0;
    --nav-active:#1d3548; --ring:#5aa9e6;
    --danger:#d6343a; --danger-text:#ff9a9e; --danger-bg:#3a1c21; --danger-line:#6b2a31;
    --ok-text:#7fd6a5; --ok-bg:#16342a; --warn-text:#f0c46b; --warn-bg:#3a2e12;
    --avatar-bg:#1b3a30; --avatar-ink:#8fe0bb; --scrim:rgba(0,0,0,.65); --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1620; --surface:#12212d; --surface-2:#182a39; --line:#24384a; --line-strong:#34506a;
  --ink:#e7eff6; --muted:#8fa5b8; --brand:#2f7fc0; --brand-ink:#ffffff; --brand-text:#8cc4f0;
  --nav-active:#1d3548; --ring:#5aa9e6;
  --danger:#d6343a; --danger-text:#ff9a9e; --danger-bg:#3a1c21; --danger-line:#6b2a31;
  --ok-text:#7fd6a5; --ok-bg:#16342a; --warn-text:#f0c46b; --warn-bg:#3a2e12;
  --avatar-bg:#1b3a30; --avatar-ink:#8fe0bb; --scrim:rgba(0,0,0,.65); --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh;height:100dvh;align-self:start}
.brand{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.brand b{display:block;font-size:13px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:10.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;color:var(--ink);font-weight:500;min-width:0}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--nav-active);color:var(--brand-text);font-weight:600}
.nav .badge{margin-left:auto;background:#12806a;color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:17px;height:17px;display:grid;place-items:center;padding:0 5px}
.nav .gap{height:14px}
.account{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--avatar-bg);color:var(--avatar-ink);display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.account .who{min-width:0;flex:1}
.account .who b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account .who span{display:block;font-size:11px;color:var(--muted)}
.link-btn{border:0;background:none;color:var(--brand-text);font-weight:600;font-size:12px;padding:4px 2px;text-decoration:underline;text-underline-offset:2px}
.main{min-width:0;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-size:24px;line-height:1.15;letter-spacing:-.02em;font-weight:700;text-wrap:balance;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.pill{font-size:11.5px;font-weight:500;color:var(--ink);background:var(--nav-active);border:1px solid var(--line);border-radius:999px;padding:3px 12px;white-space:nowrap}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:12.5px;padding:9px 16px;min-height:36px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{filter:brightness(1.1)}
.btn.quiet{background:var(--line);border-color:transparent;color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}
.chip.admin{background:var(--ok-bg);color:var(--ok-text);border-color:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:6px;padding:0 12px;background:var(--surface);min-height:36px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;padding:8px 0;color:var(--ink)}
.search:focus-within{outline:2px solid var(--ring);outline-offset:1px}
.rows{display:flex;flex-direction:column;min-width:0}
.row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,2fr) minmax(0,.8fr) minmax(0,1.3fr);gap:12px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line)}
.row.th{background:var(--surface-2);border-radius:6px;border-bottom:0;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-block:10px}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .dim{color:var(--muted);overflow-wrap:anywhere}
.row .acts{display:flex;gap:18px;align-items:center}
.act{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--brand-text);font-weight:600;font-size:12px;padding:6px 2px}
.act.del{color:var(--ink)}
.act:hover{text-decoration:underline;text-underline-offset:2px}
.act.locked{color:var(--muted)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px;padding-top:4px}
.pager{display:flex;gap:6px;flex-wrap:wrap}
.pager button{min-width:30px;height:28px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;font-size:11px;font-weight:600;padding:0 8px}
.pager button[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pager button[disabled]{opacity:.45;cursor:default}
.empty{padding:40px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:14px}
.banner{background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:9px 12px;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tile span{color:var(--muted);font-size:11.5px}
.tile b{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{min-width:0}
.li .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.li .t span{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.li time{color:var(--muted);font-size:11.5px;white-space:nowrap}
.sub{margin:0;font-size:13px;font-weight:700}
.bar-row{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 34px;gap:10px;align-items:center;padding:5px 0}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;font-size:12px;border-right:1px solid var(--line-strong)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;overflow-wrap:anywhere}
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.dialog{background:var(--surface);color:var(--ink);border-radius:8px;box-shadow:var(--shadow);width:min(100%,420px);padding:18px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.dialog.sm{width:min(100%,380px)}
.dialog h2{margin:0;font-size:18px;letter-spacing:-.01em}
.dialog .lead{margin:-8px 0 0;color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:600;color:var(--ink)}
.field input,.field textarea{border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);padding:9px 10px;min-height:36px;width:100%;color:var(--ink)}
.field textarea{resize:vertical;min-height:62px}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.8}
.field .err{color:var(--danger-text);font-size:11.5px;min-height:0}
.field input[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-color:var(--danger)}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.btns.end{justify-content:flex-end}
.btns.end .btn{flex:0 0 auto}
.warnbox{display:flex;gap:10px;background:var(--danger-bg);border:1px solid var(--danger-line);border-radius:6px;padding:12px;color:var(--danger-text)}
.warnbox b{display:block;font-size:13px}
.warnbox span{font-size:12px;font-weight:600}
.formerr{background:var(--danger-bg);color:var(--danger-text);border-radius:6px;padding:8px 10px;font-size:12px}
.note{color:var(--muted);font-size:11.5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:12.5px;box-shadow:var(--shadow);z-index:80;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .18s}
#toast.on{opacity:1}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:column;gap:12px;border-right:0;border-bottom:1px solid var(--line);padding-block:12px}
  .nav{flex-direction:row;overflow-x:auto;margin:0;padding-bottom:2px;gap:4px}
  .nav button{width:auto;white-space:nowrap;padding:8px 12px}
  .nav .gap{display:none}
  .nav .out{display:none}
  .account{display:none}
  .row.th{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 4px}
  .row .name{grid-column:1}
  .row .when{grid-column:2;grid-row:1;text-align:right;color:var(--muted);font-size:11.5px}
  .row .contact,.row .addr{grid-column:1 / -1}
  .row .acts{grid-column:1 / -1;padding-top:2px}
  .head h1{font-size:21px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

/* ---------- helpers ---------- */
function dayStart(t){var d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function fmtDate(ts){
  if(!ts) return '–';
  var d=new Date(ts), n=new Date();
  var diff=Math.round((dayStart(n)-dayStart(d))/DAY);
  if(diff<=0) return 'Today';
  if(diff===1) return 'Yesterday';
  return d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==n.getFullYear()?' '+d.getFullYear():'');

}
function barangay(a){var p=String(a||'').split(',').map(function(s){return s.trim();}).filter(Boolean); if(p.length>1&&/^brgy/i.test(p[0])) return p[1]; return p[0]||'No address';}
function attention(){
  var now=Date.now(), missing=[], stale=[];

    if(!c.email) missing.push(c);
    if(c.lastActivity && now-c.lastActivity>30*DAY) stale.push(c);
  });
  return {missing:missing,stale:stale,count:new Set(missing.concat(stale).map(function(c){return c.id;})).size};
}
function find(id){for(var i=0;i<state.rows.length;i++) if(state.rows[i].id===id) return state.rows[i]; return null;}

}
function sha256(text){
  var enc=new TextEncoder().encode(text);

    return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');
  });
}

  return SAMPLE.map(function(s,i){return {id:'s'+i,name:s[0],email:s[1],contact:s[2],address:s[3].replace('Brgy. ','Brgy, '),notes:'Sample record.',lastActivity:base-s[4]*DAY,createdAt:base-(s[4]+30)*DAY};});

function initStore(){
  var p=(window.claude&&window.claude.use)?window.claude.use('db'):Promise.resolve(null);
  return Promise.resolve(p).catch(function(){return null;}).then(function(db){
    if(db){ startShared(db); } else { startLocal(); }
  });
}
function startShared(db){
  var col=db.collection('customers');
  store={mode:'shared',
    add:function(d){return col.add(d);},
    update:function(id,d){return col.doc(id).update(d);},
    del:function(id){return col.doc(id).delete();}};
  state.mode='shared';
  col.onSnapshot(function(snap){
    state.rows=snap.docs.map(function(d){var v=d.data()||{}; v.id=d.id; return v;});
    state.loaded=true; render();
  },function(){ startLocal(); });
}
function startLocal(){
  var rows=null;
  try{ var raw=localStorage.getItem('vs101.local'); if(raw) rows=JSON.parse(raw); }catch(e){}
  if(!Array.isArray(rows)) rows=localSeed();
  state.rows=rows; state.mode='local'; state.loaded=true;
  function save(){ try{localStorage.setItem('vs101.local',JSON.stringify(state.rows));}catch(e){} render(); }
  store={mode:'local',
    add:function(d){d.id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); state.rows.push(d); save(); return Promise.resolve();},
    update:function(id,d){var r=find(id); if(r) Object.keys(d).forEach(function(k){r[k]=d[k];}); save(); return Promise.resolve();},
    del:function(id){state.rows=state.rows.filter(function(r){return r.id!==id;}); save(); return Promise.resolve();}};
  render();
}
function writeError(e){
  var c=e&&e.code;
  if(c==='invalid_argument') return 'Your access to this page is view-only, so changes can’t be saved.';
  if(c==='quota_exceeded') return 'The record limit for this page is full. Delete some records first.';
  return 'Couldn’t save that change. Check your connection and try again.';
}

function requireAdmin(next){
  if(state.admin) return true;
  openModal({type:'login',next:next}); return false;
}
function submitCustomer(ev){
  ev.preventDefault();
  var m=state.modal, name=$('f-name').value.trim(), email=$('f-email').value.trim(), contact=$('f-contact').value.trim(), address=$('f-address').value.trim(), notes=$('f-notes').value.trim(), ok=true;
  setErr('f-name',''); setErr('f-email',''); setErr('f-contact','');
  if(!name){ setErr('f-name','Enter the customer’s name.'); ok=false; }
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ setErr('f-email','Enter a valid email address, like name@example.com.'); ok=false; }
  if(contact&&contact.replace(/\D/g,'').length<7){ setErr('f-contact','Enter a phone number with at least 7 digits.'); ok=false; }
  if(!ok){ var bad=document.querySelector('#cust-form [aria-invalid="true"]'); if(bad) bad.focus(); return; }
  var data={name:name,email:email,contact:contact,address:address,notes:notes,lastActivity:Date.now()}, p;
  if(m.type==='edit'){ if(!state.admin) return; p=store.update(m.id,data); }
  else { data.createdAt=Date.now(); p=store.add(data); }
  var btn=ev.target.querySelector('[type="submit"]'); if(btn) btn.disabled=true;
  Promise.resolve(p).then(function(){ var edit=m.type==='edit'; state.modal=null; renderModal(); toast(edit?'Customer updated':'Customer added'); if(!edit){ state.q=''; state.page=1; var q=$('q'); if(q) q.value=''; } renderList(); })
  .catch(function(e){ if(btn) btn.disabled=false; toast(writeError(e)); });
}
function submitLogin(ev){
  ev.preventDefault();
  var u=$('l-user').value.trim().toLowerCase(), pw=$('l-pass').value, box=$('login-err'), btn=$('login-btn');
  var now=Date.now();
  if(state.lockUntil&&now<state.lockUntil){ box.innerHTML='<div class="formerr">Too many attempts. Try again in '+Math.ceil((state.lockUntil-now)/1000)+' seconds.</div>'; return; }
  if(!u||!pw){ box.innerHTML='<div class="formerr">Enter both a username and a password.</div>'; return; }
  btn.disabled=true;
  var done=function(hash){
    btn.disabled=false;
    if(u===ADMIN_USER&&hash===ADMIN_HASH){
      state.admin=true; state.fails=0; try{sessionStorage.setItem('vs101.admin','1');}catch(e){}
      var next=state.modal&&state.modal.next; state.modal=null; renderModal(); render(); toast('Signed in as administrator');
      if(next){ if(next.type==='delete') openModal({type:'delete',id:next.id}); else if(next.type==='edit') openModal({type:'edit',id:next.id}); }
    } else {
      state.fails=(state.fails||0)+1;
      if(state.fails>=5){ state.lockUntil=Date.now()+30000; state.fails=0; box.innerHTML='<div class="formerr">Too many attempts. Try again in 30 seconds.</div>'; }
      else box.innerHTML='<div class="formerr">That username or password is incorrect.</div>';
      $('l-pass').value=''; $('l-pass').focus();
    }
  };
  if(window.crypto&&crypto.subtle){ sha256('vs101|'+u+'|'+pw).then(done,function(){ btn.disabled=false; box.innerHTML='<div class="formerr">Sign-in isn’t available in this browser.</div>'; }); }
  else { btn.disabled=false; box.innerHTML='<div class="formerr">Sign-in isn’t available in this browser.</div>'; }
}
function logout(){
  if(!state.admin){ openModal({type:'login'}); return; }
  state.admin=false; try{sessionStorage.removeItem('vs101.admin');}catch(e){}
  render(); toast('Signed out');
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act'), id=el.getAttribute('data-id');
  if(a==='scrim'){ if(ev.target===el) closeModal(); return; }
  switch(a){
    case 'nav': state.view=el.getAttribute('data-v'); builtView=''; render(); break;
    case 'add': openModal({type:'add'}); break;
    case 'view': openModal({type:'view',id:id}); break;
    case 'edit': if(requireAdmin({type:'edit',id:id})){ state.modal={type:'edit',id:id}; renderModal(); } break;
    case 'del': if(requireAdmin({type:'delete',id:id})){ if(state.modal&&state.modal.type==='view'){ state.modal={type:'delete',id:id}; renderModal(); } else openModal({type:'delete',id:id}); } break;
    case 'confirm-del':
      if(!state.admin) return;
      el.disabled=true;
      Promise.resolve(store.del(id)).then(function(){ state.modal=null; renderModal(); toast('Customer deleted'); renderList(); }).catch(function(e){ el.disabled=false; toast(writeError(e)); });
      break;
    case 'close': closeModal(); break;
    case 'login': openModal({type:'login'}); break;
    case 'login-edit': state.modal={type:'login',next:{type:'edit',id:id}}; renderModal(); break;
    case 'logout': logout(); break;
    case 'search': var q=$('q'); if(q){ state.q=q.value; state.page=1; renderList(); } break;
    case 'clear': state.q=''; state.page=1; var q2=$('q'); if(q2){ q2.value=''; q2.focus(); } renderList(); break;
    case 'page': state.page=parseInt(el.getAttribute('data-p'),10)||1; renderList(); break;
    case 'theme':
      var t=el.getAttribute('data-t'); state.theme=t;
      if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
      try{ if(t==='auto') localStorage.removeItem('vs101.theme'); else localStorage.setItem('vs101.theme',t); }catch(e){}
      renderBody(); break;
    case 'reset': try{localStorage.removeItem('vs101.local');}catch(e){} state.rows=localSeed(); try{localStorage.setItem('vs101.local',JSON.stringify(state.rows));}catch(e){} render(); toast('Demo data reset'); break;
  }
});

});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&state.modal){ closeModal(); }
  if(ev.key==='Enter'&&ev.target.id==='q'){ state.q=ev.target.value; state.page=1; renderList(); }
});
document.addEventListener('submit',function(ev){
  if(ev.target.id==='cust-form') submitCustomer(ev);
  else if(ev.target.id==='login-form') submitLogin(ev);
});

render();
initStore();
})();
</script>

</html>
